---
- name: Add Homebrew taps
  community.general.homebrew_tap:
    tap: "{{ item }}"
    state: present
  with_items:
    - homebrew/cask
    - homebrew/cask-versions

- name: Install Homebrew Formulas
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    update_homebrew: yes
    upgrade_all: yes
  with_items:
    - chamber
    - direnv
    - git
    - git-extras
    - node
    - pyenv
    - pipenv
    - zsh
    - zlib
    - youtube-dl
    - ffmpeg
    - autojump
    - thefuck
    - wget
    - hub
    - autopep8
    - pipx
    - ncdu
    - m-cli
    - htop

- name: Install Casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    greedy: yes
    accept_external_apps: yes
    update_homebrew: yes
    upgrade_all: yes
  with_items:
    - 1password
    - firefox
    - iterm2
    - pycharm
    - slack
    - rectangle
    - spotify
    - zoomus
    - mark-text
    - bettertouchtool
    - sublime-text
    - sublime-merge
    - dozer
    - bunch
    - https://raw.githubusercontent.com/Mortennn/FiScript/master/fiscript.rb 

